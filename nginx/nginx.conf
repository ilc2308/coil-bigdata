# ============================================================
# COIL Big Data — Configuración Nginx Reverse Proxy
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # Límite de tamaño para uploads (debe coincidir con maxUploadSize de Streamlit)
    client_max_body_size 520M;

    # ── Upstream services ────────────────────────────────────
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    upstream streamlit_frontend {
        server web:8501;
        keepalive 16;
    }

    # ── Servidor principal (puerto 80) ───────────────────────
    server {
        listen 80;
        server_name _;

        # Headers de seguridad
        add_header X-Frame-Options       "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"    always;
        add_header X-XSS-Protection      "1; mode=block" always;

        # ── API FastAPI (/api/ y /docs, /redoc, /health) ─────
        location /api/ {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /docs {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
        }

        location /openapi.json {
            proxy_pass http://api_backend;
        }

        # ── Streamlit (WebSocket requerido) ──────────────────
        location / {
            proxy_pass         http://streamlit_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 86400s;   # Streamlit requiere timeouts largos
        }

        # ── Health check de Nginx ─────────────────────────────
        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
