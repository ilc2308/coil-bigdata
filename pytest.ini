[pytest]
# Modo asyncio para pytest-asyncio (requerido desde v0.21+)
asyncio_mode = auto

# Directorio de tests
testpaths = tests

# Mostrar output en tiempo real
log_cli = true
log_cli_level = WARNING

# Marcadores personalizados
markers =
    integration: Tests de integración que requieren archivos de dataset
    unit: Tests unitarios que no requieren disco ni red
    slow: Tests lentos (dataset completo 1.2M)
    aws: Tests de integración AWS (requieren moto instalado)
