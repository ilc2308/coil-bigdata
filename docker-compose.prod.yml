# ============================================================
# COIL Big Data — Docker Compose para PRODUCCIÓN / Despliegue Web
#
# Diferencias vs docker-compose.yml (desarrollo):
#   - Sin --reload en uvicorn (modo producción)
#   - Nginx como reverse proxy en puerto 80
#   - Variables de entorno desde secretos Docker o .env.prod
#   - Imágenes pre-construidas (no build local)
#   - Restart always
#   - Límites de recursos
#
# Uso:
#   docker-compose -f docker-compose.prod.yml up -d
#
# URLs con Nginx:
#   http://<IP>/       → Streamlit Dashboard
#   http://<IP>/api/   → FastAPI (proxied)
#   http://<IP>/docs   → Swagger UI
# ============================================================

version: "3.9"

services:

  # ----------------------------------------------------------
  # API FastAPI (backend)
  # ----------------------------------------------------------
  api:
    image: coil-api:2.0.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coil-api-prod
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      APP_MODE: ${APP_MODE:-local}
    volumes:
      - ./api:/app/api
      - ./src:/app/src
      - ./.env:/app/.env
      - ./dataset:/app/dataset:ro
      - coil_output:/app/output
      - coil_uploads:/app/uploads
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always
    networks:
      - coil-internal

  # ----------------------------------------------------------
  # Frontend Streamlit
  # ----------------------------------------------------------
  web:
    image: coil-web:2.0.0
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: coil-web-prod
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      API_BASE_URL: http://api:8000
    volumes:
      - ./app:/app/app
      - ./src:/app/src
      - ./.env:/app/.env
      - ./dataset:/app/dataset:ro
      - coil_output:/app/output
      - coil_uploads:/app/uploads
    expose:
      - "8501"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
    depends_on:
      api:
        condition: service_healthy
    restart: always
    networks:
      - coil-internal

  # ----------------------------------------------------------
  # Nginx — Reverse Proxy
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: coil-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    restart: always
    networks:
      - coil-internal
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  coil_output:
    driver: local
  coil_uploads:
    driver: local

networks:
  coil-internal:
    driver: bridge
